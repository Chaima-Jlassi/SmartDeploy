namespace: prod
serviceName: order-service
nodeEnv: production
replicaCount: 2
image:
  repository: smartdeployacr.azurecr.io/order-service
  digest: ""
service:
  port: 3000
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuThreshold: 60
