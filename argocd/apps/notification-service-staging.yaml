apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service-staging
  namespace: argocd
  labels:
    env: staging
spec:
  project: default
  source:
    repoURL: https://github.com/Chaima-Jlassi/SmartDeploy.git
    targetRevision: staging
    path: helm
    helm:
      valueFiles:
        - values-notification-service-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
