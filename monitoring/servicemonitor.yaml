apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-catalog
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [dev, staging, prod]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [product-catalog, order-service, notification-service]
  targetLabels:
    - app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s