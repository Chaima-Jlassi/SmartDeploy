apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: product-catalog-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: product-catalog
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total[2m])) > 0.05
          for: 2m
          labels:
            severity: critical
            app: product-catalog
          annotations:
            summary: "High error rate detected"
            description: "Error rate above 5% for 2 minutes"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            app: product-catalog
          annotations:
            summary: "High p95 latency"
            description: "p95 latency above 500ms for 5 minutes"