apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartdeploy-service-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: smartdeploy-services
      rules:
        - alert: HighErrorRate
          expr: |
            sum by (namespace, app) (
              rate(http_requests_total{
                app=~"product-catalog|order-service|notification-service",
                status=~"5.."
              }[2m])
            )
            /
            clamp_min(
              sum by (namespace, app) (
                rate(http_requests_total{
                  app=~"product-catalog|order-service|notification-service"
                }[2m])
              ),
              0.001
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            app: '{{ $labels.app }}'
          annotations:
            summary: "High error rate detected"
            description: "Error rate above 5% for 2 minutes"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le, namespace, app) (
                rate(http_request_duration_seconds_bucket{
                  app=~"product-catalog|order-service|notification-service"
                }[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            app: '{{ $labels.app }}'
          annotations:
            summary: "High p95 latency"
            description: "p95 latency above 500ms for 5 minutes"