apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: smartdeploy-alerts
  namespace: monitoring
  labels:
    alertmanagerConfig: smartdeploy
spec:
  route:
    receiver: logic-app-rollback
    groupBy: [alertname, app, namespace]
    groupWait: 30s
    groupInterval: 2m
    repeatInterval: 4h
    matchers:
      - name: severity
        value: critical
  receivers:
    - name: logic-app-rollback
      webhookConfigs:
        - urlSecret:
            name: logicapp-webhook
            key: url
          sendResolved: false